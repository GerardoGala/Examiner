<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Examiner</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Reference to your new external CSS file -->
  <link rel="stylesheet" href="css/index.css">

  <!-- STEP 1: Load Core Map Engines & Global Variables First -->
  <script src="js/globalSimulationData.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 
  <!-- STEP 2: Load Your Core Simulator Engine Layouts -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/ilcaHandleControls.js"></script>
  <script type="module" src="js/ilcaMap.js"></script>


  <!-- STEP 4: Load UI and Event Listeners Last -->
  <!-- (Using 'defer' ensures the HTML elements are fully built before they run) -->
  <script src="js/gameDashboard.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=.5, user-scalable=no">
</head>
<body>
  <div class="container">
    <div id="inputControl"       style="flex: 1;">
        <h4>Control Selector</h4>

        <div class="point-of-sail-options" style="display: flex; gap: 12px; align-items: center;">

            <label>
                <input type="radio" name="inputControl" value="1">
                Sheet
            </label>

            <label>
                <input type="radio" name="inputControl" value="2">
                Sailor Position
            </label>

            <label>
                <input type="radio" name="inputControl" value="3">
                Daggerboard
            </label>

            <label>
                <input type="radio" name="inputControl" value="4">
                Vang
            </label>

            <label>
                <input type="radio" name="inputControl" value="5">
                Downhaul
            </label>
            <label>
                <input type="radio" name="inputControl" value="6">
                Outhaul
            </label>
        </div>
    </div>
    <div id="map"                style="flex: 9;">
      <button id="startExamBtn">Start Exam</button>
    </div>
    <div id="input-pane"         style="flex: 2;">

      <div id="boomControl" class="input-section">
        <h4>&nbsp;MainSheet</h4>
        <div class="control-row">
          <!-- Upwind Ranges -->
          <button class="control-button" data-control="boom" data-value="0-8" onclick="updateBoomControl('0-8')">0° - 8°</button>
          <button class="control-button" data-control="boom" data-value="5-15" onclick="updateBoomControl('5-15')">5° - 15°</button>
        </div>
        <div class="control-row">
          <!-- Reaching Ranges -->
          <button class="control-button" data-control="boom" data-value="35-65" onclick="updateBoomControl('35-65')">35° - 65°</button>
          <button class="control-button" data-control="boom" data-value="40-70" onclick="updateBoomControl('40-70')">40° - 70°</button>
      </div>
          <div class="control-row">  
          <!-- Downwind Ranges -->
          <button class="control-button" data-control="boom" data-value="75-85" onclick="updateBoomControl('75-85')">75° - 85°</button>
          <button class="control-button" data-control="boom" data-value="90" onclick="updateBoomControl('90')">90°</button>
        </div>
      </div>

      <div id="daggerboardControl" class="input-section">
        <div class="control-column">
          <h4>&nbsp;Daggerboard Control</h4>
          <button class="control-button" data-control="daggerboard" data-value="Up" onclick="updateDaggerboardControl('CENTERBOARD UP')">Up</button>
          <button class="control-button" data-control="daggerboard" data-value="Center" onclick="updateDaggerboardControl('Center')">Center</button>
          <button class="control-button" data-control="daggerboard" data-value="Down" onclick="updateDaggerboardControl('Down')">Down</button>
        </div>
      </div>

      <div id="sailorPositionControl" class="input-section">
        <h4>&nbsp;Sailor Position</h4>
        <div class="control-row">
          <button class="control-button" data-control="sailorPosition" data-value="Forward" onclick="updateSailorPosition('Forward')">Forward</button>
        </div>
        <div class="control-row">
          <!-- STANDARDIZED: Set exclusively to Hike Hard -->
          <button class="control-button" data-control="sailorPosition" data-value="Hike Hard" onclick="updateSailorPosition('Hike Hard')">Hike Hard</button>
          <button class="control-button" data-control="sailorPosition" data-value="Mid Center" onclick="updateSailorPosition('Mid Center')">Mid Center</button>
          <button class="control-button" data-control="sailorPosition" data-value="Leeward" onclick="updateSailorPosition('Leeward')">Leeward</button>
        </div>
        <div class="control-row">
          <button class="control-button" data-control="sailorPosition" data-value="Aft" onclick="updateSailorPosition('Aft')">Aft</button>
        </div>
      </div>

      <div id="vangControl" class="input-section">
        <div class="control-column">
          <h4>&nbsp;Vang</h4>
          <button class="control-button" data-control="vang" data-value="Max" onclick="updateVangControl('Max')">MAX</button>
          <button class="control-button" data-control="vang" data-value="Center" onclick="updateVangControl('Center')">CENTER</button>
          <button class="control-button" data-control="vang" data-value="Ease" onclick="updateVangControl('Ease')">EASE</button>
        </div>
      </div>

      <div id="downhaulControl" class="input-section">
        <div class="control-column">
          <h4>&nbsp;Downhaul</h4>
          <!-- 🎯 FIXED FOR PERFECT CONSISTENCY WITH SCENARIO_TARGETS -->
          <button class="control-button" data-control="downhaul" data-value="Max Luff" onclick="updateDownhaulControl('Max Luff')">MAX LUFF</button>
          <button class="control-button" data-control="downhaul" data-value="Base" onclick="updateDownhaulControl('Base')">BASE</button>
          <button class="control-button" data-control="downhaul" data-value="Off" onclick="updateDownhaulControl('Off')">OFF</button>
        </div>
      </div>

      <div id="outhaulControl" class="input-section">
        <div class="control-column">
          <h4>&nbsp;Outhaul</h4>
          <!-- 🎯 FIXED: Passed text strings to update functions and data-values -->
          <button class="control-button" data-control="outhaul" data-value="Flat" onclick="updateOuthaulControl('Flat')">FLAT</button>
          <button class="control-button" data-control="outhaul" data-value="Base" onclick="updateOuthaulControl('Base')">BASE</button>
          <button class="control-button" data-control="outhaul" data-value="Full" onclick="updateOuthaulControl('Full')">FULL</button>
        </div>
      </div>
    </div>
  </div>
 


  <script>
    // Map start simulation button logic
    const startExamBtn = document.getElementById('startExamBtn');
  
    if (startExamBtn) {
        startExamBtn.addEventListener('click', () => {
          launchSimulation();
          startExamBtn.style.display = 'none';
       });
    }
  </script>

    }

    document.addEventListener("click", function(event) {
        // Check if the clicked item is a control button
        if (event.target.classList.contains("control-button")) {
            
            // Find the parent section (like #boomControl or #vangControl)
            const parentSection = event.target.closest(".input-section");
            
            if (parentSection) {
                // Find any previously selected button in THIS section and clear it
                const previousActive = parentSection.querySelector(".control-button.selected");
                if (previousActive) {
                    previousActive.classList.remove("selected");
                }
                
                // Add the highlight class to the newly clicked button
                event.target.classList.add("selected");
            }
        }
    });

    function updateOuthaulControl(val) { console.log("Outhaul set to:", val); }

  <script>
    // Map start simulation button logic
    const mapStartSimulationBtn = document.getElementById('mapStartSimulationBtn');
    if (mapStartSimulationBtn) {
        mapStartSimulationBtn.addEventListener('click', () => {
          launchSimulation();
          mapStartSimulationBtn.style.display = 'none';
        });
    }
  </script>

    const params = new URLSearchParams(window.location.search);
    const control = params.get("control") || "sailorPositionControl";

    if (controlDiv) {
        controlDiv.classList.add("active");

            const parentSection = event.target.closest(".input-section");
            
            if (parentSection) {
                // Find any previously selected button in THIS section and clear it
                const previousActive = parentSection.querySelector(".control-button.selected");
                if (previousActive) {
                    previousActive.classList.remove("selected");
                }
                
                // Add the highlight class to the newly clicked button
                event.target.classList.add("selected");
            }
        }

    function updateSailorPosition(val) { console.log("Sailor position set to:", val); }
    function updateVangControl(val) { console.log("Vang set to:", val); }
    function updateDownhaulControl(val) { console.log("Downhaul set to:", val); }
    function updateOuthaulControl(val) { console.log("Outhaul set to:", val); }
</script>


  <script>
    document.querySelectorAll('input[name="wind"]').forEach(radio => {
        radio.addEventListener("change", () => {
            const windSpeed = Number(radio.value);
            window.globalSimulationData.windSpeed = windSpeed;
            console.log("Wind changed to:", windSpeed, "knots");
        });
    });
</script>

</body>
</html>
