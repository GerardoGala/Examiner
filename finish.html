<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Race Finished</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <section class="container text-center py-4">
    <div style="max-width: 800px; margin: 0 auto;">
      <h2>Congratulations!</h2>
      <p id="raceSummary">
        Your race time is <span id="raceTime">--</span> seconds.<br>
      </p>
    </div>
    <button onclick="closeFinishDialog()"  class="btn btn-primary btn-lg">Close</button>
  </section>

  <script>
    function initResultsPage() {
      const urlParams = new URLSearchParams(window.location.search);
    
      // 1. Grab primary headers straight out of the URL parameter strings
      const raceTimeValue = urlParams.get('time') || '0';
      document.getElementById("raceTime").innerText = raceTimeValue;
    }
    function closeFinishDialog() {
      const urlParams = new URLSearchParams(window.location.search);
      const finalTimeScore = urlParams.get('time') || '0';
      window.location.href = `index.html?time=${finalTimeScore}`;
    }

    // Launch execution loops on view loading
    initResultsPage();
  </script>
</body>
</html>
