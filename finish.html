<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Race Finished</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<section class="container text-center py-4">
  <div id="pass" style="max-width: 800px; margin: 0 auto; display:none;">
    <h2>Congratulations!</h2>
    <p>
      Your race time is <span id="raceTimePass">--</span> seconds.<br>
    </p>
  </div>

  <div id="fail" style="max-width: 800px; margin: 0 auto; display:none;">
    <h2>Please try again</h2>
    <p>
      Your race time of <span id="raceTimeFail">--</span> seconds did not meet the maximum limit of 240 seconds.<br>
    </p>
  </div>

  <button onclick="closeFinishDialog()" class="btn btn-primary btn-lg">Close</button>
</section>

<script>
  function initResultsPage() {
    const urlParams = new URLSearchParams(window.location.search);
    const raceTimeValue = parseFloat(urlParams.get('time')) || 0;

    if (raceTimeValue <= 240) {
      document.getElementById("pass").style.display = "block";
      document.getElementById("raceTimePass").innerText = raceTimeValue;
    } else {
      document.getElementById("fail").style.display = "block";
      document.getElementById("raceTimeFail").innerText = raceTimeValue;
    }
  }

  function closeFinishDialog() {
    const urlParams = new URLSearchParams(window.location.search);
    const finalTimeScore = urlParams.get('time') || '0';
    window.location.href = `index.html?time=${finalTimeScore}`;
  }

  // Run on load
  initResultsPage();
</script>

</body>
</html>
